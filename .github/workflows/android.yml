name: Build Complete SafeShield APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Full Android Project Structure
        run: |
          mkdir -p app/src/main/java/com/example/safeshield
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

          # 1. AndroidManifest.xml (الصلاحيات والخدمات والواجهات)
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.example.safeshield">

              <uses-permission android:name="android.permission.BIND_ACCESSIBILITY_SERVICE" />
              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:label="SafeShield"
                  android:theme="@style/Theme.AppCompat.Light.DarkActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".ScreenFilterService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="false">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>

              </application>
          </manifest>
          EOF

          # 2. إعدادات خدمة الوصول (Accessibility Config)
          cat << 'EOF' > app/src/main/res/xml/accessibility_service_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault|flagRetrieveInteractiveWindows"
              android:canRetrieveWindowContent="true"
              android:notificationTimeout="100" />
          EOF

          # 3. MainActivity.java (الواجهة والتحكم بالخدمة)
          cat << 'EOF' > app/src/main/java/com/example/safeshield/MainActivity.java
          package com.example.safeshield;

          import android.content.Intent;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.view.View;
          import android.widget.Button;
          import android.widget.TextView;
          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  
                  TextView tv = new TextView(this);
                  tv.setText("SafeShield Protection Engine Active\n\nPlease enable Accessibility Service.");
                  tv.setTextSize(18);
                  tv.setPadding(40, 40, 40, 40);

                  Button btn = new Button(this);
                  btn.setText("Enable Accessibility Settings");
                  btn.setOnClickListener(new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          Intent intent = new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS);
                          startActivity(intent);
                      }
                  });

                  android.widget.LinearLayout layout = new android.widget.LinearLayout(this);
                  layout.setOrientation(android.widget.LinearLayout.VERTICAL);
                  layout.setPadding(50, 50, 50, 50);
                  layout.addView(tv);
                  layout.addView(btn);

                  setContentView(layout);
              }
          }
          EOF

          # 4. ScreenFilterService.java (الخدمة الحقيقية للفلترة ومراقبة الشاشة)
          cat << 'EOF' > app/src/main/java/com/example/safeshield/ScreenFilterService.java
          package com.example.safeshield;

          import android.accessibilityservice.AccessibilityService;
          import android.view.accessibility.AccessibilityNodeInfo;
          import android.view.accessibility.AccessibilityEvent;
          import android.util.Log;

          public class ScreenFilterService extends AccessibilityService {
              private static final String TAG = "SafeShieldFilter";

              @Override
              public void onAccessibilityEvent(AccessibilityEvent event) {
                  AccessibilityNodeInfo rootNode = getRootInActiveWindow();
                  if (rootNode != null) {
                      checkNodeForRestrictedContent(rootNode);
                      rootNode.recycle();
                  }
              }

              private void checkNodeForRestrictedContent(AccessibilityNodeInfo node) {
                  if (node == null) return;
                  
                  if (node.getText() != null) {
                      String text = node.getText().toString().toLowerCase();
                      if (text.contains("restricted_keyword")) {
                          Log.d(TAG, "Blocked restricted content detected!");
                          performGlobalAction(GLOBAL_ACTION_BACK);
                      }
                  }

                  for (int i = 0; i < node.getChildCount(); i++) {
                      AccessibilityNodeInfo child = node.getChild(i);
                      if (child != null) {
                          checkNodeForRestrictedContent(child);
                          child.recycle();
                      }
                  }
              }

              @Override
              public void onInterrupt() {
                  Log.d(TAG, "Accessibility Service Interrupted");
              }
          }
          EOF

          # 5. ملفات التكوين والـ Gradle للبناء
          echo "include ':app'" > settings.gradle

          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath "com.android.tools.build:gradle:7.4.2"
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          cat << 'EOF' > app/build.gradle
          apply plugin: 'com.android.application'
          android {
              compileSdkVersion 33
              defaultConfig {
                  applicationId "com.example.safeshield"
                  minSdkVersion 21
                  targetSdkVersion 33
                  versionCode 1
                  versionName "1.0"
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF

          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build APK with Gradle
        run: ./gradlew assembleDebug

      - name: Upload Final APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SafeShield-Complete-APK
          path: app/build/outputs/apk/debug/app-debug.apk
