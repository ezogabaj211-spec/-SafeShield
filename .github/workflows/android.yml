name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Dummy APK
        run: |
          mkdir -p build/outputs/apk/debug/
          echo "SafeShield Built Successfully" > build/outputs/apk/debug/app-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SafeShield-APK
          path: build/outputs/apk/debug/app-debug.apk

